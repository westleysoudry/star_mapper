policy:
  allow_recent_coauthors_as_letter_writers: false
  allow_same_department_letter_writers: false
  # OpenAlex rarely exposes department-level data for candidates: their
  # last_known_institution usually points to the root university, not a faculty.
  # Requiring same_department therefore makes the bucket empty in practice —
  # which is the correct, honest result when dept data is unavailable.
  # If department CAN be inferred (from institution sub-unit names or a provided
  # CV), dept_explicitly_different in assignment.py will enforce the match.
  # Researchers blocked here are re-evaluated as area_mentors automatically.
  dept_mentor_requires_same_department: false
  dept_mentor_requires_same_institution: true
  dept_mentors_allows_coauthors: true            # at same institution, coauthorship is a positive signal, not a conflict
  israel_country_code: "IL"
  rebalance_bucket_caps: true
  enable_supplemental_in_area_fill: true

  # Exclude industry researchers from academic mentor / letter-writer roles.
  # Detection is based on the OpenAlex institution type field ("company").
  exclude_industry_from_mentors: true
  exclude_industry_from_letter_writers: true

  # Exclude researchers with no publications in the last N years (filters
  # deceased researchers and long-retired faculty).
  max_inactivity_years: 10

  # same_area thresholds — calibrated for author-level topic-summary vectors.
  # (Jaccard similarity on sparse T-prefixed topic vectors is lower than
  #  full-publication vectors.)
  #
  # Threshold structure (same_area ranges):
  #   < 0.07            : excluded from all output
  #   [0.07, 0.18)      : interdisciplinary collaborators only
  #   [0.18, 0.45)      : in_area only with citation/coauthor familiarity bridge
  #   >= 0.45           : in_area collaborators, letter writers, area/dept mentors
  min_same_area_for_in_area_collaborator: 0.18   # borderline-area researchers below this redirect to interdisciplinary_collaborators
  min_same_area_for_supplemental_in_area: 0.25
  min_seniority_for_supplemental_in_area: 0.45
  min_same_area_for_unbridged_in_area_collaborator: 0.45  # below this, require citation/coauthor familiarity
  min_familiarity_for_borderline_in_area: 0.30
  min_same_area_for_unbridged_country_in_area_collaborator: 0.35  # country list exception for senior local same-area researchers
  min_seniority_for_unbridged_country_in_area_collaborator: 0.50
  min_reputation_for_unbridged_country_in_area_collaborator: 0.55
  min_same_area_for_country_moderate_supplemental_in_area: 0.40
  min_seniority_for_country_moderate_supplemental_in_area: 0.48
  min_same_area_for_country_broad_supplemental_in_area: 0.25
  max_same_area_for_country_broad_supplemental_in_area: 0.35
  min_seniority_for_country_broad_supplemental_in_area: 0.50
  min_reputation_for_country_broad_supplemental_in_area: 0.0
  min_base_similarity_for_country_broad_supplemental_in_area: 0.18
  min_same_area_for_senior_supplemental_in_area: 0.35
  min_seniority_for_senior_supplemental_in_area: 0.60
  min_reputation_for_senior_supplemental_in_area: 0.58
  min_same_area_for_letter_writer: 0.30          # raised to align with dept_mentor; excludes borderline-in-area researchers from letter-writer roles
  min_same_area_for_area_mentor: 0.30            # aligned with letter_writer: mentors must have at least moderate topic overlap
  min_same_area_for_interdisciplinary_min: 0.07  # below this threshold excluded from all output
  min_same_area_for_interdisciplinary_max: 0.18  # aligned with in_area/area_mentor min (no dead zone between buckets)
  min_complementary_topic_for_interdisciplinary: 0.15
  min_same_area_for_dept_mentor: 0.30           # same-institution researchers must share the research area, not just the building
  min_seniority_for_mentors: 0.65              # mentors must be established researchers
  min_seniority_for_letter_writers: 0.65        # ensures letter writers are senior enough to carry weight
  min_seniority_for_collaborators: 0.45         # conservative proxy for "already has PhD"; OpenAlex has no PhD-status field
  strong_same_area_for_junior_collaborator: 0.55 # allow clear same-area junior faculty even when seniority proxy is slightly low
  min_reputation_for_letter_writers: 0.75       # letter writers should be clear field leaders, not just topical matches

  # Number of years back considered "recent coauthor"

  recent_coauthor_years: 5
  # Target total per geo list
  target_list_size: 20
  # Minimum seniority for ANY candidate to appear in any list.  0.40 excludes
  # most PhD students (career_age < 5, title "unknown") while still admitting
  # junior faculty.  Combined with min_works_for_all below, catches students
  # whose seniority is inflated by OpenAlex record contamination.
  min_seniority_for_all: 0.40
  # Minimum publication count for ANY candidate.  Raised to 20 so PhD students
  # (typically 5-15 works) are excluded even when seniority is inflated by
  # contaminated cited_by_count.  Faculty candidates — even junior — typically
  # have 20+ OpenAlex-indexed works.
  min_works_for_all: 20
  # Exclude coauthors from ALL output lists (not just letter writers)
  exclude_all_coauthors: true
