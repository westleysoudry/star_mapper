weights:
  base_similarity:
    topic: 0.35
    citation: 0.30      # raised: shared-reference overlap is target-specific
    collaboration: 0.20
    venue: 0.10
    career: 0.05        # lowered: career-stage similarity is not researcher-specific

  buckets:
    in_area_collaborators:
      same_area: 0.45
      collaboration: 0.15  # lowered to make room for venue
      venue: 0.20           # raised: shared publication venues is a specificity signal
      institution_distance_bonus: 0.10
      recency_overlap: 0.10

    interdisciplinary_collaborators:
      complementary_topic: 0.35
      method_complementarity: 0.20
      citation_bridge: 0.15
      collaboration_potential: 0.15
      institutional_proximity: 0.15

    recommendation_letter_writers:
      same_area: 0.30
      seniority: 0.20        # lowered: reduces "big name" generic effect
      reputation: 0.15       # lowered: reduces "big name" generic effect
      no_conflict: 0.15
      familiarity_proxy: 0.15  # raised: direct knowledge of the researcher's work
      venue: 0.05              # new: venue overlap as a specificity tiebreaker

    dept_mentors:
      department_match: 0.35
      same_area: 0.25
      seniority: 0.20
      institutional_role: 0.10
      mentoring_signal: 0.10

    area_mentors:
      same_area: 0.35
      seniority: 0.25
      reputation: 0.15
      distance_diversity_bonus: 0.15
      mentoring_signal: 0.10
