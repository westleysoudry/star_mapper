name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HF_SPACE_REPO: westleysoudry/academic-star-map

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upload repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_REPO"]
          api = HfApi()
          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              token=token,
              ignore_patterns=[
                  ".git/*",
                  ".github/*",
                  ".pytest*",
                  "__pycache__/*",
                  "**/__pycache__/*",
                  "*.pyc",
                  "build/*",
                  "output/*",
                  "tmpono_f8ey/*",
                  "src/*.egg-info/*",
                  ".env",
              ],
          )
          PY
